<div class="layout">
  <div class="backdrop" [class.show]="sidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="brand">
      <svg class="logo" viewBox="0 0 56 40" aria-hidden="true">
        <path
          d="M43 0C50.1797 6.44277e-07 56 5.8203 56 13C56 20.1797 50.1797 26 43 26H34.4844L48.4844 40H31.5156L15.7578 24.2422C14.672 23.1564 14 21.6569 14 20C14 16.6863 16.6863 14 20 14H43C43.5523 14 44 13.5523 44 13C44 12.4477 43.5523 12 43 12H20C15.5817 12 12 15.5817 12 20C12 22.3901 13.0482 24.5347 14.71 26H14.6875L28.6875 40H20C8.95431 40 0 31.0457 0 20C0 8.95431 8.9543 0 20 0H43Z"
          fill="#6d8dff"
        />
        <path d="M56 28V40H51.3125L39.3125 28H56Z" fill="#6d8dff" />
      </svg>
      <div>
        <strong>zeerp</strong>
        <span>PT Jumpwin Sports Indonesia</span>
      </div>
    </div>
    <button type="button" class="search-trigger" (click)="openPalette()">
      <span>Cari halaman…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav>
      <a
        class="nav-item"
        routerLink="/dashboard"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <span class="dot"></span> Dashboard
      </a>

      <button type="button" class="group-head" (click)="masterOpen.set(!masterOpen())">
        Master Data
        <span class="chev" [class.rot]="masterOpen()">›</span>
      </button>
      <div class="group" [class.open]="masterOpen()">
        <div class="group-inner">
          <a
            class="nav-item"
            routerLink="/master/style-bom"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Style &amp; BOM</a
          >
        </div>
      </div>

      <button type="button" class="group-head" (click)="opsOpen.set(!opsOpen())">
        Operasional
        <span class="chev" [class.rot]="opsOpen()">›</span>
      </button>
      <div class="group" [class.open]="opsOpen()">
        <div class="group-inner">
          <a
            class="nav-item"
            routerLink="/operasional/order"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Order &amp; Style</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/barang-masuk"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Barang Masuk</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/gudang-bahan"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Gudang Bahan</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/cutting"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Cutting</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/produksi"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Produksi</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/finishing-qc"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Finishing &amp; QC</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/gudang-fg"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Gudang FG</a
          >
          <a
            class="nav-item"
            routerLink="/operasional/barang-sisa"
            routerLinkActive="active"
            (click)="closeSidebar()"
            ><span class="dot"></span> Barang Sisa</a
          >
        </div>
      </div>
    </nav>

    <div class="user-box">
      <div class="avatar">{{ userEmail().charAt(0).toUpperCase() }}</div>
      <div class="user-meta">
        <span class="user-email">{{ userEmail() }}</span>
        <button type="button" class="logout" (click)="onLogout()">Keluar</button>
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button type="button" class="burger" (click)="toggleSidebar()" aria-label="Menu">☰</button>
      <strong>zeerp</strong>
    </header>
    <main class="main">
      <router-outlet />
      <footer class="app-footer">© 2026 zeerp — All rights reserved by reziipn</footer>
    </main>
  </div>

  @if (paletteOpen()) {
    <app-command-palette (closed)="paletteOpen.set(false)" />
  }
</div>
