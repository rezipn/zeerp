            <g class="face">
              <g class="eyes">
                <g class="eye">
                  <circle class="eye-white" cx="120" cy="138" r="7" />
                  <circle class="pupil" cx="120" cy="138" r="3.2" />
                </g>
                <g class="eye">
                  <circle class="eye-white" cx="142" cy="138" r="7" />
                  <circle class="pupil" cx="142" cy="138" r="3.2" />
                </g>
              </g>
              <ellipse class="blush" cx="111" cy="151" rx="5.5" ry="3.2" />
              <ellipse class="blush" cx="151" cy="151" rx="5.5" ry="3.2" />
              <path class="mouth" d="M123,156 Q131,163 139,156" />
              <circle class="mouth-o" cx="131" cy="158" r="3.6" />

          <g class="char-body">
            <path d="M172,240 L172,196 A36,36 0 0 1 244,196 L244,240 Z" fill="#ff9f43" />
            <g class="face">
              <g class="eyes">
                <g class="eye">
                  <circle class="eye-white" cx="197" cy="204" r="6.5" />

                </g>
                <g class="eye">
                  <circle class="eye-white" cx="219" cy="204" r="6.5" />
                  <circle class="pupil" cx="219" cy="204" r="3" />
                </g>
              </g>
              <ellipse class="blush" cx="188" cy="216" rx="5" ry="3" />
              <ellipse class="blush" cx="228" cy="216" rx="5" ry="3" />
              <path class="mouth" d="M200,220 Q208,226 216,220" />

              <g class="eyes">

                  <circle class="eye-white" cx="272" cy="192" r="6.5" />

                  <circle class="eye-white" cx="292" cy="192" r="6.5" />
                  <circle class="pupil" cx="292" cy="192" r="3" />

              </g>
              <ellipse class="blush" cx="264" cy="204" rx="5" ry="3" />
              <ellipse class="blush" cx="300" cy="204" rx="5" ry="3" />

    </div>

    <form class="form-side" (ngSubmit)="onLogin()">
      <div class="brand">
  <svg class="logo" viewBox="0 0 56 40" aria-hidden="true">
    <path d="M43 0C50.1797 6.44277e-07 56 5.8203 56 13C56 20.1797 50.1797 26 43 26H34.4844L48.4844 40H31.5156L15.7578 24.2422C14.672 23.1564 14 21.6569 14 20C14 16.6863 16.6863 14 20 14H43C43.5523 14 44 13.5523 44 13C44 12.4477 43.5523 12 43 12H20C15.5817 12 12 15.5817 12 20C12 22.3901 13.0482 24.5347 14.71 26H14.6875L28.6875 40H20C8.95431 40 0 31.0457 0 20C0 8.95431 8.9543 0 20 0H43Z" fill="#6d8dff" />
    <path d="M56 28V40H51.3125L39.3125 28H56Z" fill="#6d8dff" />
  </svg>
  <h1>zeerp</h1>
</div>
      <p class="subtitle">Masuk ke akun kamu</p>

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required placeholder="nama@jumpwins.com" />
      </label>

      <label>
        Password
        <span class="password-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="••••••••"
            (focus)="passwordFocused.set(true)"
            (blur)="passwordFocused.set(false)"
          />
          <button type="button" class="toggle" (click)="togglePassword()" aria-label="Tampilkan password">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </span>
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'Memproses...' : 'Masuk' }}
      </button>
    </form>
  </div>
</div>
